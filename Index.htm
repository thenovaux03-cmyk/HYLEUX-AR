<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HYLUEX AR Card</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #loading {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #FFC107; font-family: Arial; font-size: 18px; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="loading">HYLUEX AR load ho raha hai...</div>
  
  <a-scene mindar-image="imageTargetSrc: ./targets.mind.txt;"
           color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="photo" src="./1000042405-removebg-preview.png">
      <img id="logo" src="./svgviewer-png-output.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-image src="#photo" 
               position="0 0.3 0" 
               height="0.6" width="0.5"
               animation="property: position; to: 0 0.35 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
      </a-image>

      <a-text value="HYLUEX" 
              position="0 0.9 0" 
              align="center" 
              color="#0A3D91"
              width="2"
              animation="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
      </a-text>

      <a-text value="HYLUEX Provide Services" 
              position="0 -0.5 0" 
              align="center" 
              color="#FFC107"
              width="1.8">
      </a-text>

    </a-entity>
  </a-scene>
  
  <script>
    document.querySelector('a-scene').addEventListener('renderstart', () => {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
